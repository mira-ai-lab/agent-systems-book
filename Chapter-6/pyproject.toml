[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chapter6-travel"
version = "0.2.0"
description = "Chapter 6 centralized travel multi-agent system"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "langgraph>=0.0.30",
    "chromadb>=0.4.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[tool.setuptools]
py-modules = [
    "config",
    "travel_planning",
    "domain_agents",
    "task_planner",
    "agent_routing",
    "orchestrator",
    "memory_adapter",
]
