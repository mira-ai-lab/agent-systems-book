[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chapter6-travel"
version = "0.2.0"
description = "Chapter 6 centralized travel multi-agent system"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "chromadb>=0.4.0",
    "httpx>=0.25.0",
    "jieba>=0.42.1",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rank-bm25>=0.2.2",
]

[tool.setuptools]
py-modules = [
    "config",
    "domain_agents",
    "task_plan",
    "agent_routing",
    "orchestrator",
    "memory_adapter",
]
